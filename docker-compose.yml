services:
  db:
    image: postgres:16-alpine
    container_name: mahall-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mahall
      POSTGRES_PASSWORD: mahall_dev_password
      POSTGRES_DB: mahall
    ports:
      - "5435:5432"
    volumes:
      - mahall-db-data:/var/lib/postgresql/data
volumes:
  mahall-db-data:
